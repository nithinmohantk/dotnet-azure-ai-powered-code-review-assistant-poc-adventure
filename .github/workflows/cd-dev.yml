name: CD - Development

on:
  push:
    branches: [ develop ]
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [ develop ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: development
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'
    
    - name: Build Application
      run: dotnet publish ./src/WebApi/CodeReviewAssistant.WebApi -c Release -o ./publish
    
    - name: Build Docker Image
      run: |
        docker build -t codereview-api:dev ./docker
        docker tag codereview-api:dev ghcr.io/${{ github.repository }}:dev
    
    - name: Login to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Push Docker Image
      run: docker push ghcr.io/${{ github.repository }}:dev
    
    - name: Deploy to Kubernetes
      run: |
        echo "${{ secrets.KUBECONFIG_DEV }}" | base64 -d > kubeconfig
        export KUBECONFIG=kubeconfig
        helm upgrade --install codereview-api ./k8s/helmcharts/codereview-api \
          --namespace development \
          --create-namespace \
          --set image.tag=dev \
          --set environment=development \
          --values ./k8s/helmcharts/codereview-api/values-dev.yaml
