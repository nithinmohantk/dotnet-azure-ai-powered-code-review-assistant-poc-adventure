version: '3.8'

services:
  # API Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codereview-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=CodeReviewDB;User Id=sa;Password=CodeReview123!;TrustServerCertificate=true;
      - Azure__CosmosDb__Endpoint=https://localhost:8081
      - Azure__CosmosDb__Key=C2y6yDjf5/R+ob0N8A7Cgv30VRDjWEJL/SLT0c8
      - Azure__ServiceBus__ConnectionString=Endpoint=sb://localhost:5672/;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=CodeReview123!
      - Azure__OpenAI__Endpoint=https://localhost:8082
      - Azure__OpenAI__ApiKey=YourOpenAIApiKey
      - Azure__KeyVault__Uri=https://localhost:8443
    depends_on:
      - sqlserver
      - redis
      - rabbitmq
    networks:
      - codereview-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Background Worker Service
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codereview-worker
    command: ["dotnet", "CodeReviewAssistant.Worker.dll"]
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=CodeReviewDB;User Id=sa;Password=CodeReview123!;TrustServerCertificate=true;
      - Azure__CosmosDb__Endpoint=https://localhost:8081
      - Azure__CosmosDb__Key=C2y6yDjf5/R+ob0N8A7Cgv30VRDjWEJL/SLT0c8
      - Azure__ServiceBus__ConnectionString=Endpoint=sb://localhost:5672/;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=CodeReview123!
      - Azure__OpenAI__Endpoint=https://localhost:8082
      - Azure__OpenAI__ApiKey=YourOpenAIApiKey
      - Azure__KeyVault__Uri=https://localhost:8443
    depends_on:
      - sqlserver
      - redis
      - rabbitmq
    networks:
      - codereview-network
    restart: unless-stopped

  # SQL Server Database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: codereview-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=CodeReview123!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - codereview-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P CodeReview123! -Q 'SELECT 1'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: codereview-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - codereview-network
    command: redis-server --appendonly yes --requirepass CodeReview123!
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3

  # Azure Service Bus (RabbitMQ as local alternative)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: codereview-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=codereview
      - RABBITMQ_DEFAULT_PASS=CodeReview123!
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - codereview-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MinIO (Local S3-compatible storage)
  minio:
    image: minio/minio:latest
    container_name: codereview-minio
    environment:
      - MINIO_ROOT_USER=codereview
      - MINIO_ROOT_PASSWORD=CodeReview123!
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - codereview-network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Jaeger (Distributed Tracing)
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: codereview-jaeger
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
    ports:
      - "5775:5775/udp"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "16686:16686"
      - "14250:14250"
      - "14268:14268"
      - "14269:14269"
      - "9411:9411"
    networks:
      - codereview-network

  # Prometheus (Metrics)
  prometheus:
    image: prom/prometheus:latest
    container_name: codereview-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - codereview-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'

  # Grafana (Visualization)
  grafana:
    image: grafana/grafana:latest
    container_name: codereview-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=CodeReview123!
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - codereview-network
    depends_on:
      - prometheus

  # Code Review Assistant API
  api2:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: codereview-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=CodeReviewAssistant;User Id=sa;Password=CodeReview123!;TrustServerCertificate=true;
      - Redis__ConnectionString=codereview-redis:6379,password=CodeReview123!
      - EventBus__ConnectionString=amqp://codereview:CodeReview123!@rabbitmq:5672/
      - Storage__ConnectionString=minio:9000
      - Storage__AccessKey=codereview
      - Storage__SecretKey=CodeReview123!
      - Storage__DefaultBucket=codereview-artifacts
      - Jaeger__Endpoint=http://jaeger:14268/api/traces
      - GitHub__Token=${GITHUB_TOKEN}
      - AzureOpenAI__Endpoint=${AZURE_OPENAI_ENDPOINT}
      - AzureOpenAI__Key=${AZURE_OPENAI_KEY}
      - AzureOpenAI__DeploymentName=${AZURE_OPENAI_DEPLOYMENT_NAME}
    ports:
      - "5000:8080"
      - "5001:8081"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - codereview-network
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx (Reverse Proxy)
  nginx:
    image: nginx:alpine
    container_name: codereview-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - api
    networks:
      - codereview-network

volumes:
  sqlserver_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  minio_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  codereview-network:
    driver: bridge
